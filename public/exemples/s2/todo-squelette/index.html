<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List PHP/MySQL</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Todo List persistante</h1>
    <form id="ajout">
      <label for="title">Tâche (120 caractères maximum)</label>
      <input id="title" name="title" required maxlength="120">
      <button>Ajouter</button>
    </form>
    <label for="filtre">Afficher</label>
    <select id="filtre">
      <option value="all">Toutes</option>
      <option value="todo">À faire</option>
      <option value="done">Terminées</option>
    </select>
    <button id="relire" type="button">Relire les données</button>
    <p id="etat" role="status"></p>
    <ul id="liste"></ul>
  </main>
</body>
</html>
